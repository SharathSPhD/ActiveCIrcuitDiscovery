# Standard x86_64 (amd64) compose target -- runs on any NVIDIA GPU host,
# including a single T4 (16 GB). Counterpart to docker-compose.yml (DGX/aarch64).
#
#   docker compose -f docker-compose.amd64.yml run --rm acd \
#       python -m src.experiments.run_real_experiments --model gemma --experiment ioi
version: "3.8"

services:
  acd:
    build:
      context: .
      dockerfile: Dockerfile.amd64
    image: acd:amd64
    container_name: acd-amd64
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./results:/workspace/ActiveCircuitDiscovery/results
      - ./notebooks:/workspace/ActiveCircuitDiscovery/notebooks
      - hf-cache:/workspace/ActiveCircuitDiscovery/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "8gb"
    command: python -m src.experiments.run_real_experiments --model gemma --experiment all

volumes:
  hf-cache:
